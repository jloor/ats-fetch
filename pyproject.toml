[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-fetch"
version = "1.2.0"
description = "Archive a job posting verbatim from the applicant tracking system's own API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonathan Loor", email = "jon@loor.email" }]
keywords = ["ats", "greenhouse", "lever", "ashby", "workday", "job-posting", "archive"]

# No dependencies, and that is a design constraint rather than an accident. Adding one
# would mean this stops working on a machine that has nothing but a Python interpreter.
dependencies = []

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/jloor/ats-fetch"
Repository = "https://github.com/jloor/ats-fetch"
Changelog = "https://github.com/jloor/ats-fetch/blob/main/CHANGELOG.md"
Issues = "https://github.com/jloor/ats-fetch/issues"

[project.scripts]
ats-fetch = "ats_fetch:main"

# A single module at the repository root, not a package directory. Stating it explicitly
# stops setuptools from guessing and from sweeping tests/ into the distribution.
[tool.setuptools]
py-modules = ["ats_fetch"]
